# git-cliff ~ default configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} [**BREAKING**]{% endif %}
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "Features" },
  # Dependency bumps belong in "Build & CI" whatever type they carry. Renovate
  # is configured for `build(deps)` (renovate.json5), but these two rules are
  # the backstop for anything that arrives otherwise — a hand-made bump, or the
  # config:recommended packageRules silently reasserting `fix`/`chore`, which is
  # how v0.3.3 shipped a gomega bump under "Bug Fixes".
  #
  # Both MUST precede the generic `^fix` and `^chore` rules below: git-cliff
  # takes the first matching parser.
  { message = "^fix\\(deps\\)", group = "Build & CI" },
  { message = "^chore\\(deps\\)", group = "Build & CI" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build & CI" },
  { message = "^ci", group = "Build & CI" },
  { message = "^chore", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
